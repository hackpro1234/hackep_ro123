<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#703de2">
<title>مبروووووك! لقد فزت بآيفون 🎉</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100svh;padding:32px 20px 40px;background:radial-gradient(ellipse at 10% 15%,#ffe1ee 0,transparent 45%),radial-gradient(ellipse at 90% 85%,#ddd4ff 0,transparent 45%),#f5efff;color:#36205c;font-family:Tahoma,Arial,sans-serif;text-align:center;overflow-x:hidden}
main{position:relative;z-index:1;width:min(100%,560px);margin:auto}
.welcome{display:inline-block;margin:0 0 14px;padding:10px 22px;border:1px solid #dfcef7;border-radius:50px;background:#ffffffc9;color:#6e37bf;font-size:15px;font-weight:bold}
h1{margin:0;font-size:clamp(38px,9vw,64px);line-height:1.3;letter-spacing:-1px;color:#703de2}
.subtitle{margin:10px 0 20px;font-size:clamp(22px,5vw,30px);font-weight:bold;line-height:1.5}
.photo{position:relative;width:min(100%,370px);margin:0 auto 22px}
.photo:before{content:'';position:absolute;inset:14% -5%;border-radius:50%;background:#c7b1ff;filter:blur(40px);opacity:.45;z-index:-1}
.photo img{display:block;width:100%;height:auto;aspect-ratio:1;object-fit:cover;border-radius:32px;box-shadow:0 18px 44px #6236a821}
.sticker{position:absolute;bottom:-10px;left:-8px;transform:rotate(-8deg);background:#ffe58c;border:3px solid #fff;padding:10px 18px;border-radius:12px;font-weight:bold;color:#674511;box-shadow:0 5px 14px #68461215}
.message{font-size:18px;line-height:1.9;margin:24px 0 18px}
.message strong{display:block;font-size:22px;color:#6630bb}
.claim{display:block;width:min(100%,390px);margin:0 auto;padding:18px 24px;border-radius:18px;background:#703de2;color:#fff;text-decoration:none;font-size:22px;font-weight:bold;box-shadow:0 8px 0 #5023b3,0 16px 28px #703de22c;transition:transform .15s,background .15s}
.claim:hover{background:#6230d0;transform:translateY(-2px)}
.claim:active{transform:translateY(4px);box-shadow:0 4px 0 #5023b3}
.claim:focus-visible,.celebrate:focus-visible{outline:3px solid #36205c;outline-offset:6px}
.celebrate{margin:24px 0 0;border:0;background:transparent;color:#7444b6;font:inherit;font-size:15px;cursor:pointer;padding:10px}
.confetti{position:fixed;inset:0;z-index:2;pointer-events:none;overflow:hidden}
.piece{position:absolute;top:-30px;width:9px;height:16px;background:var(--color);left:var(--left);opacity:0;animation:fall var(--duration) linear var(--delay) infinite}
.piece:nth-child(3n){border-radius:50%;width:10px;height:10px}
.piece:nth-child(5n){width:6px;height:23px}
@keyframes fall{0%{opacity:0;transform:translate3d(0,-30px,0) rotate(0)}5%{opacity:.9}90%{opacity:.9}100%{opacity:0;transform:translate3d(var(--drift),110vh,0) rotate(720deg)}}
@media(max-width:420px){body{padding:24px 18px 32px}.photo{width:290px;max-width:95%}.welcome{font-size:13px}.message{font-size:16px}.message strong{font-size:20px}}
@media(prefers-reduced-motion:reduce){.piece{animation:none;display:none}.claim{transition:none}}
</style>
</head>
<body>
<div class="confetti" aria-hidden="true" id="confetti"></div>
<main>
<p class="welcome">🎊 اليوم يومك… والفرحة فرحتك! 🎊</p>
<h1>مبروووووك! 🎉</h1>
<p class="subtitle">لقد فزت بآيفون!</p>
<div class="photo">
<img src="iphone-celebration.png" alt="هاتف آيفون أزرق وسط زينة احتفالية" width="1024" height="1024" fetchpriority="high">
<span class="sticker">🎁 يا حظّك!</span>
</div>
<p class="message"><strong>فرحة كبيرة تستاهلها! 🥳</strong>ألف مبروك الفوز… خلّ الاحتفال يبدأ!<br>اضغط على الزر وتواصل معنا عبر إنستغرام.</p>
<a class="claim" href="https://www.instagram.com/direct/inbox/">اضغط للحصول عليه 🎁</a>
<button class="celebrate" type="button" id="celebrate">🎉 نحتفل مرّة ثانية!</button>
</main>
<script>
const confetti = document.getElementById('confetti');
const colors = ['#8751e8','#f35e9d','#f5c542','#43bfc4','#ff8b51'];
function celebrate(){
  confetti.replaceChildren();
  const pieces = document.createDocumentFragment();
  for(let i=0;i<65;i++){
    const piece = document.createElement('i');
    piece.className = 'piece';
    piece.style.setProperty('--color',colors[i % colors.length]);
    piece.style.setProperty('--left',Math.random()*100+'%');
    piece.style.setProperty('--duration',5+Math.random()*5+'s');
    piece.style.setProperty('--delay',-Math.random()*10+'s');
    piece.style.setProperty('--drift',(Math.random()-.5)*180+'px');
    pieces.appendChild(piece);
  }
  confetti.appendChild(pieces);
}
celebrate();
document.getElementById('celebrate').addEventListener('click',celebrate);
</script>
</body>
</html>
